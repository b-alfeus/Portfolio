                    <option value="en">EN</option>
                    <option value="id">ID</option>
                    <option value="jp">JP</option>
                    <option value="de">DE</option>

                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <svg class="icon-sun" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>

        <main>
            <section class="page-header">
                <h1 data-i18n="article.heading">Posts</h1>
                <p data-i18n="article.intro">Notes on design, process, and the things I find worth thinking about.</p>
            </section>

            <section class="article-featured" aria-labelledby="article-featured-heading">
                <h2 class="article-section-label" id="article-featured-heading" data-i18n="article.featured">Featured</h2>
                <div class="carousel" data-carousel>
                    <div class="carousel-viewport">
                        <div class="carousel-track"></div>
                    </div>
                    <button type="button" class="carousel-btn carousel-prev" aria-label="Previous">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>

                    <button type="button" class="carousel-btn carousel-next" aria-label="Next">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                    <div class="carousel-dots" role="tablist" aria-label="Featured posts"></div>
                </div>
            </section>

            <section class="article-list" aria-labelledby="article-all-heading">
                <div class="article-list-header">
                    <h2 class="article-section-label" id="article-all-heading" data-i18n="article.all">All Posts</h2>
                    <label class="article-search">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

                    </label>
                </div>
                <p class="article-empty" id="articleEmpty" hidden data-i18n="article.empty">No posts match your search.</p>
