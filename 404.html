<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Page not found — Bryan Widjaya.">
        <meta name="author" content="Bryan Widjaya">
        <meta name="robots" content="noai, noimageai">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; connect-src 'self' https://cdn.jsdelivr.net; img-src 'self' https://mirrors.creativecommons.org data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; form-action 'none';">
        <title>Bryan Widjaya • 404</title>
        <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <section class="error-page" aria-labelledby="error-title">
                <div class="error-meta error-meta--tl" aria-hidden="true">
                    <span>Status</span>
                    <span class="error-meta-sep">·</span>
                    <span class="error-meta-value">404</span>
                </div>
                <div class="error-meta error-meta--tr" aria-hidden="true">
                    <span>Requested</span>
                    <span class="error-meta-sep">·</span>
                    <span class="error-meta-value" id="errorPath">/</span>
                </div>

                <div class="error-stage">
                    <h1 class="error-numerals" id="error-title">
                        <span class="error-numeral" aria-hidden="true">4</span><span class="error-numeral error-numeral--hollow" aria-hidden="true">0</span><span class="error-numeral" aria-hidden="true">4</span>
                        <span class="visually-hidden" data-i18n="error.404.title">404 — Page not found</span>
                    </h1>
                    <div class="error-route" aria-hidden="true">
                        <span class="error-route-line"></span>
                        <span class="error-route-tip">×</span>
                    </div>
                </div>

                <p class="error-lede" data-i18n="error.404.body">The page you're looking for doesn't exist — or has wandered off somewhere.</p>

                <a href="index.html" class="error-cta">
                    <span class="error-cta-bracket" aria-hidden="true">[</span>
                    <span class="error-cta-arrow" aria-hidden="true">←</span>
                    <span data-i18n="error.404.cta">Back to Home</span>
                    <span class="error-cta-bracket" aria-hidden="true">]</span>
                </a>

                <div class="error-meta error-meta--bl" aria-hidden="true">
                    <span>B. Widjaya</span>
                    <span class="error-meta-sep">·</span>
                    <span>MMXXVI</span>
                </div>
                <div class="error-meta error-meta--br" aria-hidden="true">
                    <span>(end of route)</span>
                </div>
            </section>
        </main>

        <script src="shared.js"></script>
        <script>
            const pathEl = document.getElementById('errorPath');
            if (pathEl) {
                const path = window.location.pathname || '/';
                pathEl.textContent = path.length > 32 ? path.slice(0, 30) + '…' : path;
            }
        </script>
    </body>
</html>
