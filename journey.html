            <div class="header-controls">
                <select class="lang-select" id="langSelect" aria-label="Language">
                    <option value="en">EN</option>
                    <option value="id">ID</option>
                    <option value="jp">JP</option>
                    <option value="de">DE</option>
                </select>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <svg class="icon-sun" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                    <svg class="icon-moon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
            </div>

        <main>
            <section class="page-header">
                <h1 data-i18n="journey.heading">Journey</h1>
                <p data-i18n="journey.intro">A record of where I've been — the milestones, pivots, and moments that shaped the work.</p>
            </section>

            <section class="journey">
                <div class="journey-layout">
                    <aside class="journey-aside" aria-hidden="true">
                        <div class="journey-map-wrap">
                            <canvas class="journey-map" id="journeyMap"></canvas>
                        </div>
                        <div class="journey-map-readout">
                            <div class="journey-map-readout-line">
                                <span>Where</span>
                                <span class="journey-map-readout-sep">·</span>
                                <span class="journey-map-readout-value" id="mapPlace">Jakarta, ID</span>
                            </div>
                            <div class="journey-map-readout-line">
                                <span>Coords</span>
                                <span class="journey-map-readout-sep">·</span>
                                <span class="journey-map-readout-value" id="mapCoords">-6.21, 106.85</span>
                            </div>
                        </div>
                    </aside>
                    <div class="journey-panel">
                        <ol class="timeline"></ol>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p class="footer-font" data-i18n-html="footer.typeface">&copy; MMXXVI. Typeface using <a href="https://usgraphics.com/products/berkeley-mono" target="_blank" rel="noopener noreferrer">Berkeley Mono</a> by <a href="https://usgraphics.com" target="_blank" rel="noopener noreferrer">U.S. Graphics</a></p>

        </footer>

        <script src="shared.js"></script>
        <script type="module">
            import { geoMercator, geoPath, geoInterpolate, geoDistance } from 'https://esm.sh/d3-geo@3';
            import { feature } from 'https://esm.sh/topojson-client@3';

            const canvas = document.getElementById('journeyMap');
            const placeEl = document.getElementById('mapPlace');
            const coordsEl = document.getElementById('mapCoords');
            if (!canvas) { /* nothing to do */ } else {
                const ctx = canvas.getContext('2d');
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                let cssW = 320, cssH = 320;

                const fitCanvas = () => {
                    const rect = canvas.getBoundingClientRect();
                    cssW = Math.max(1, rect.width);
                    cssH = Math.max(1, rect.height);
                    canvas.width  = Math.round(cssW * dpr);
                    canvas.height = Math.round(cssH * dpr);
                };

                let landDots = [];
                const FIXED_SCALE = 1800; // city-region zoom on a ~320px viewport

                let curLng = 106.8456, curLat = -6.2088;
                let curScale = FIXED_SCALE;
                let panFrom = [curLng, curLat];
                let panTo   = [curLng, curLat];
                let panInterp = null;
                let panProgress = 1;   // 0 → 1 across the flight
                let lineFade = 0;      // 1 during flight, fades after arrival
                let pulse = 0;

                const easeInOutCubic = (t) => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

                const projection = geoMercator()
                    .scale(FIXED_SCALE)
                    .translate([0, 0]);

                const isDark = () => document.documentElement.dataset.theme === 'dark';

                function bakeLandDots(land) {
                    const W = 1024, H = 512;
                    const off = document.createElement('canvas');
                    off.width = W; off.height = H;
                    const oc = off.getContext('2d');
                    oc.fillStyle = '#000'; oc.fillRect(0, 0, W, H);
                    oc.fillStyle = '#fff';
                    const proj = geoMercator()
                        .scale(W / (2 * Math.PI))
                        .translate([W / 2, H / 2]);
                    const pth = geoPath(proj, oc);
                    oc.beginPath(); pth(land); oc.fill();
                    const data = oc.getImageData(0, 0, W, H).data;
                    const dots = [];
                    const step = 1; // densest sampling — every land pixel of the 2048×1024 mask
                    for (let y = 0; y < H; y += step) {
                        for (let x = 0; x < W; x += step) {
                            if (data[(y * W + x) * 4] > 128) {
                                const ll = proj.invert([x, y]);
                                if (ll) dots.push(ll);
                            }
                        }
                    }
                    return dots;
                }

                function setTarget(lat, lng, place) {
                    if (lng === panTo[0] && lat === panTo[1]) {
                        if (placeEl && place) placeEl.textContent = place;
                        return;
                    }
                    panFrom = [curLng, curLat];
                    panTo = [lng, lat];
                    panInterp = geoInterpolate(panFrom, panTo);
                    panProgress = 0;
                    lineFade = 1;
                    if (placeEl && place) placeEl.textContent = place;
                    if (coordsEl) coordsEl.textContent = `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
                }

                function colors() {
                    const dark = isDark();
                    const cs = getComputedStyle(document.documentElement);
                    const accent = cs.getPropertyValue('--color-accent').trim() || (dark ? '#64d2ff' : '#00838f');
                    return {
                        dot: dark ? 'rgba(255,255,255,0.34)' : 'rgba(0,0,0,0.32)',
                        accent,
                    };
                }

                function render() {
                    const W = canvas.width, H = canvas.height;
                    ctx.clearRect(0, 0, W, H);
                    projection
                        .center([curLng, curLat])
                        .scale(curScale * dpr)
                        .translate([W / 2, H / 2]);

                    const { dot, accent } = colors();
                    ctx.fillStyle = dot;
                    const r = Math.max(2, Math.round(2 * dpr));
                    const halfR = r / 2;
                    for (let i = 0; i < landDots.length; i++) {
                        const p = projection(landDots[i]);
                        if (!p) continue;
                        const px = p[0], py = p[1];
                        if (px < -8 || px > W + 8 || py < -8 || py > H + 8) continue;
                        ctx.fillRect(px - halfR, py - halfR, r, r);
                    }

                    // Network-transfer curve: dotted great-circle line
                    if (lineFade > 0 && panInterp) {
                        const N = 80;
                        ctx.strokeStyle = accent;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';

                        // Faint full path (preview of where the camera will go)
                        ctx.lineWidth = 1.4 * dpr;
                        ctx.globalAlpha = lineFade * 0.22;
                        ctx.setLineDash([0, 5 * dpr]);
                        ctx.beginPath();
                        let started = false;
                        for (let i = 0; i <= N; i++) {
                            const p = projection(panInterp(i / N));
                            if (!p) continue;
                            if (!started) { ctx.moveTo(p[0], p[1]); started = true; }
                            else { ctx.lineTo(p[0], p[1]); }
                        }
                        ctx.stroke();

                        // Active flowing dotted line up to the camera
                        ctx.globalAlpha = lineFade * 0.9;
                        ctx.lineWidth = 2 * dpr;
                        ctx.setLineDash([0, 6 * dpr]);
                        ctx.lineDashOffset = -performance.now() / 35;
                        ctx.beginPath();
                        started = false;
                        const upto = Math.ceil(N * panProgress);
                        for (let i = 0; i <= upto; i++) {
                            const p = projection(panInterp(i / N));
                            if (!p) continue;
                            if (!started) { ctx.moveTo(p[0], p[1]); started = true; }
                            else { ctx.lineTo(p[0], p[1]); }
                        }
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Tiny "packet" square right at the leading edge — sized like a map dot
                        const head = projection(panInterp(panProgress));
                        if (head) {
                            const packet = Math.max(2, Math.round(2 * dpr));
                            const ph = packet / 2;
                            ctx.fillStyle = accent;
                            ctx.globalAlpha = lineFade;
                            ctx.fillRect(
                                Math.round(head[0] - ph),
                                Math.round(head[1] - ph),
                                packet,
                                packet
                            );
                        }
                        ctx.globalAlpha = 1;
                    }

                    // Blinking square marker at current camera position (terminal-cursor style)
                    const m = projection([curLng, curLat]);
                    if (m) {
                        const blinkOn = (Math.floor(performance.now() / 500) % 2) === 0;
                        const sq = 9 * dpr;
                        const half = sq / 2;
                        if (blinkOn) {
                            ctx.fillStyle = accent;
                            ctx.fillRect(m[0] - half, m[1] - half, sq, sq);
                        } else {
                            ctx.strokeStyle = accent;
                            ctx.lineWidth = 1.5 * dpr;
                            ctx.strokeRect(m[0] - half, m[1] - half, sq, sq);
                        }
                    }
                }

                function tick() {
                    if (panInterp && panProgress < 1) {
                        panProgress = Math.min(1, panProgress + 0.018);
                        const eased = easeInOutCubic(panProgress);
                        const p = panInterp(eased);
                        curLng = p[0];
                        curLat = p[1];

                        // Dip the zoom out mid-flight so the line is actually visible for far hops
                        const dist = geoDistance(panFrom, panTo); // radians
                        if (dist > 0.05) {
                            const fitScale = Math.max(180, FIXED_SCALE / (1 + dist * 6));
                            const dip = Math.sin(panProgress * Math.PI); // 0 → 1 → 0
                            curScale = FIXED_SCALE * (1 - dip) + fitScale * dip;
                        } else {
                            curScale = FIXED_SCALE;
                        }
                    } else {
                        curScale = FIXED_SCALE;
                        if (lineFade > 0) lineFade = Math.max(0, lineFade - 0.022);
                    }
                    pulse += 0.045;
                    render();
                    requestAnimationFrame(tick);
                }

                async function init() {
                    fitCanvas();
                    new ResizeObserver(() => { fitCanvas(); render(); }).observe(canvas);

                    let world, journey;
                    try {
                        [world, journey] = await Promise.all([
                            fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json').then(r => r.json()),
                            fetch('data/journey.json', { cache: 'no-cache' }).then(r => r.json()),
                        ]);
                    } catch { return; }

                    const land = feature(world, world.objects.land);
                    landDots = bakeLandDots(land);

                    const events = journey.flatMap(g => g.events || []);
                    const eventById = new Map(events.map(e => [e.id, e]));

                    // Re-render on theme toggle (colors change)
                    new MutationObserver(render)
                        .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

                    tick();

                    const syncFromEvent = (target) => {
                        if (!target) return;
                        const ev = eventById.get(target.dataset.eventId);
                        if (ev?.location?.lat != null) {
                            setTarget(ev.location.lat, ev.location.lng, ev.location.place || '');
                        }
                    };

                    const attach = () => {
                        const items = document.querySelectorAll('.timeline-event');
                        if (!items.length) return false;

                        // Initial: sync to whichever event the navigator marks focused
                        const initial = document.querySelector('.timeline-event.is-focused') || items[0];
                        syncFromEvent(initial);

                        // Watch for the navigator (or any code) toggling .is-focused on events
                        const mo = new MutationObserver((muts) => {
                            for (const m of muts) {
                                if (m.attributeName !== 'class') continue;
                                const t = m.target;
                                if (t.classList.contains('is-focused')) {
                                    syncFromEvent(t);
                                    break;
                                }
                            }
                        });
                        items.forEach(it => mo.observe(it, { attributes: true, attributeFilter: ['class'] }));
                        return true;
                    };

                    if (!attach()) {
                        const mo = new MutationObserver(() => { if (attach()) mo.disconnect(); });
                        mo.observe(document.querySelector('.timeline'), { childList: true, subtree: true });
                    }
                }

                requestAnimationFrame(init);
            }
        </script>
    </body>
